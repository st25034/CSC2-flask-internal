    <!DOCTYPE html>
    <html lang="en">
    <head>
        <title>{% block title %}Donut Shop{% endblock %}</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <header>
             <div class="nav-container">
                <h1>Donuttery</h1>
                
                <a href="{{ url_for('index') }}" class="logo-link">
                    <img src="{{ url_for('static', filename='images/donut_logo.png') }}"
                        alt="Donuttery logo"
                        class="logo">
                </a>

                <nav>
                    <a href="{{ url_for('index') }}">Home</a>
                    <a href="{{ url_for('about') }}">About</a>
                    <a href="{{ url_for('order_history') }}">Order History</a>
                    <a href="{{ url_for('invoices') }}">Invoices</a>
                    <a href="{{ url_for('cart') }}" class="cart-link" aria-label="View shopping cart">
                        <span class="cart-icon">🛒</span>
                    </a>
>
                </nav>

             </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p>&copy; 2026 Donut Shop</p>
        </footer>
    </body>
    </html>
