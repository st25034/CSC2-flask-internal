<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Successfully Displayed</h1>

    <ul>
        {%for donut, details in donuts.items() %}
        <li>{{ donut }} - ${{ details ['price'] }} (Stock: {{ details ['stock'] }})</li>
        {% endfor %}
    </ul>   

    <h2>Add-ons available</h2>
    
    <ul>
        {% for addon, details in addons.items() %}
        <li>{{ addon }} (${{ details['price'] }})</li>
        {% endfor %}
    </ul>
</body>
</html>
